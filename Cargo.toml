# SpectreMesh Workspace

[workspace]
resolver = "2"
members = [
    "crates/spectre-elf-btf",
    "crates/spectre-verifier",
    "crates/spectre-xdp",
    "crates/spectre-tls",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ardhya Novri Ramadhan <ardhyasan@gmail.com>"]

[workspace.dependencies]
libc = "0.2"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
