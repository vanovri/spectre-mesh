# SpectreMesh Workspace

[workspace]
resolver = "2"
members = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Ardhya Novri Ramadhan <ardhyasan@gmail.com>"]

[workspace.dependencies]
libc = "0.2"
bitflags = "2.6"
thiserror = "2.0"
memchr = "2.7"
crc32c = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
parking_lot = "0.12"
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
